<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RopTV — эфир для всех</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;900&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14123a;--bg2:#1d1a52;--ink:#f3eeff;--dim:#a9a3d6;--amber:#ffb400;--pink:#ff3d6e;--line:#2f2b78}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(1200px 600px at 50% -10%,var(--bg2),var(--bg));color:var(--ink);font:400 16px/1.5 Manrope,system-ui,sans-serif;min-height:100vh;padding:0 16px 40px}
header{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0;flex-wrap:wrap}
.logo{font:900 30px Unbounded,sans-serif;letter-spacing:-1px}
.logo b{color:var(--amber)}
.me{display:flex;gap:8px;align-items:center;color:var(--dim);font-size:14px}
.me input{background:var(--bg2);border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:10px;width:150px;font:inherit}
main{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 260px;gap:24px;align-items:start}
.tv{background:#0a0922;border:2px solid var(--line);border-radius:28px;padding:14px;box-shadow:0 30px 80px #0008}
.screen{position:relative;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden}
.screen:fullscreen{border-radius:0;aspect-ratio:auto}
video{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.bug{position:absolute;top:12px;left:14px;font:900 14px Unbounded;background:#000a;padding:4px 10px;border-radius:8px}
.bug b{color:var(--amber)}
.live{position:absolute;top:12px;right:14px;font:600 12px Unbounded;background:var(--pink);padding:4px 10px;border-radius:8px;display:none}
.on .live{display:block;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.55}}
@media(prefers-reduced-motion:reduce){.on .live{animation:none}}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:10px 14px;background:linear-gradient(transparent,#000c)}
.bar button{background:none;border:0;color:var(--ink);font-size:22px;cursor:pointer;padding:4px 8px;border-radius:8px}
.bar button:focus-visible,.cta:focus-visible{outline:3px solid var(--amber)}
.bar input[type=range]{width:90px;accent-color:var(--amber)}
.bar .sp{flex:1}
.bar .t{font-size:13px;color:var(--dim)}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;background:#000a}
.ov.hide{display:none}
.ov h2{font:900 clamp(20px,4vw,38px) Unbounded}
.ov p{color:var(--dim)}
.cta{background:var(--amber);color:#1a1200;border:0;font:900 15px Unbounded;padding:12px 22px;border-radius:14px;cursor:pointer}
.screen.full{position:fixed;inset:0;z-index:9999;aspect-ratio:auto;border-radius:0;cursor:none;background:#000}
.screen.full .bar,.screen.full .live,.screen.full .ov{display:none!important}
.screen.full .bug{font-size:16px;opacity:.7}
.ov.hold{background:#0007}
.screen.full .ov.hold:not(.hide){display:flex!important}
.now{padding:14px 6px 4px;display:flex;justify-content:space-between;gap:8px;color:var(--dim)}
.now strong{color:var(--ink);font-family:Unbounded;font-weight:600}
aside{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:18px}
aside h3{font:600 16px Unbounded;display:flex;justify-content:space-between}
aside h3 span{color:var(--amber)}
#users{list-style:none;padding:0;margin-top:12px;display:grid;gap:8px;max-height:420px;overflow:auto}
#users li{display:flex;gap:10px;align-items:center}
#users li::before{content:"";width:9px;height:9px;border-radius:50%;background:#3dff9a;flex:none}
@media(max-width:820px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">Rop<b>TV</b></div>
  <label class="me">Твой ник <input id="nick" maxlength="20" placeholder="Гость"></label>
</header>
<main>
  <section>
    <div class="tv">
      <div class="screen" id="screen">
        <video id="v" playsinline muted preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate"></video>
        <div class="bug">Rop<b>TV</b></div><div class="live">В ЭФИРЕ</div>
        <div class="ov" id="off"><h2>Эфир сейчас выключен</h2><p>Как только запустят видео, оно начнётся здесь само.</p></div>
        <div class="ov hold hide" id="hold"><h2>⏸ Эфир на паузе</h2><p>Скоро продолжим с того же места.</p></div>
        <div class="ov hide" id="gate"><h2>Идёт эфир</h2><button class="cta" id="join">Смотреть со звуком</button></div>
        <div class="bar">
          <button id="mute" aria-label="Звук">🔊</button>
          <input type="range" id="vol" min="0" max="1" step="0.05" value="1" aria-label="Громкость">
          <span class="t" id="time"></span><span class="sp"></span>
          <button id="fs" aria-label="На весь экран">⛶</button>
        </div>
      </div>
    </div>
    <div class="now"><span>Сейчас в эфире</span><strong id="title">—</strong></div>
  </section>
  <aside>
    <h3>Онлайн <span id="count">0</span></h3>
    <ul id="users"></ul>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://qxguizijvutacxvfkovc.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4Z3VpemlqdnV0YWN4dmZrb3ZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMjkzNzIsImV4cCI6MjEwODgwNTM3Mn0.u7SUyx_HnmZYxItnz_ByBA7FP8jDqNvy20jrQnwsgMw";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const v = $("v"), screen = $("screen");
let offset = 0, row = null, live = false, ended = false, curUrl = "", lastEnd = 0;

const fmt = s => { s = Math.max(0, s | 0); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
// позиция в эфире: на паузе она заморожена, иначе считается по серверным часам
const pos = () => row.paused ? (row.pause_pos || 0) : (Date.now() + offset - new Date(row.started_at).getTime()) / 1000;
const canPlay = () => live && !ended && !(row && row.paused);

function showOff(msg) {
  screen.classList.remove("on");
  $("gate").classList.add("hide"); $("hold").classList.add("hide");
  $("off").classList.remove("hide");
  $("off").querySelector("h2").textContent = msg || "Эфир сейчас выключен";
}
function showLive() {
  $("off").classList.add("hide");
  screen.classList.add("on");
  if (v.muted && !$("gate").dataset.done) $("gate").classList.remove("hide");
}
function stop(msg) {
  live = false; ended = false; curUrl = "";
  v.pause(); v.removeAttribute("src"); v.load();
  showOff(msg);
  $("title").textContent = "—"; $("time").textContent = "";
}
// видео доиграло: просим сервер переключить на следующее из очереди (или выключить эфир)
function finished() {
  if (ended) return;
  ended = true; v.pause();
  showOff(row && row.queue && row.queue.length ? "Сейчас начнётся следующий мультик…" : "Эфир закончился");
  endCheck();
}
function endCheck() {
  if (!row || Date.now() - lastEnd < 2000) return;
  lastEnd = Date.now();
  sb.rpc("broadcast_ended", { ts: row.started_at }).then(() => {}, () => {});
}

function apply(r) {
  row = r;
  if (!r.is_live || !r.video_url) return stop();
  $("title").textContent = r.title || "RopTV";
  ended = false; live = true;
  // то же видео (пауза, продолжение, перемотка): не перезагружаем, только подстраиваем время
  if (curUrl === r.video_url && v.getAttribute("src")) {
    if (v.readyState >= 1) { showLive(); tick(); }
    return;
  }
  curUrl = r.video_url;
  v.src = r.video_url;
  v.onloadedmetadata = () => {
    if (!row.paused && pos() >= v.duration) return finished();
    v.currentTime = Math.min(Math.max(0, pos()), v.duration);
    showLive();
    tick();
  };
}

function tick() {
  if (!row || !row.is_live) return;
  if (ended) { endCheck(); return; }
  if (!live || v.readyState < 1) return;
  const p = pos(), dur = v.duration || 0;
  if (!row.paused && dur && p >= dur) return finished();
  if (row.paused) {
    if (Math.abs(v.currentTime - p) > 0.3) v.currentTime = Math.min(p, dur || p);
    if (!v.paused) v.pause();
  } else {
    if (Math.abs(v.currentTime - p) > 2.5) v.currentTime = p;
    if (v.paused && !v.ended) v.play().catch(() => {});
  }
  $("hold").classList.toggle("hide", !row.paused);
  $("time").textContent = fmt(v.currentTime) + " / " + fmt(dur);
}

// зрители не могут поставить эфир на паузу сами (только админ)
v.addEventListener("pause", () => { if (canPlay() && !v.ended) v.play().catch(() => {}); });
v.addEventListener("ended", () => finished());
document.addEventListener("contextmenu", e => { if (e.target.closest("#screen")) e.preventDefault(); });
document.addEventListener("keydown", e => { if (e.key === " " || e.key === "k" || e.key === "MediaPlayPause") e.preventDefault(); });
setInterval(tick, 1000);

// страховка, если realtime пропустил обновление
setInterval(async () => {
  try {
    const { data } = await sb.from("broadcast").select("*").eq("id", 1).single();
    if (!data) return;
    const k = r => [r.is_live, r.video_url, r.started_at, r.paused, r.pause_pos].join("|");
    if (!row || k(row) !== k(data)) apply(data); else row = data;
  } catch (e) {}
}, 15000);

// звук и экран
$("join").onclick = () => { v.muted = false; $("gate").dataset.done = 1; $("gate").classList.add("hide"); if (canPlay()) v.play().catch(() => {}); sync(); };
$("mute").onclick = () => { v.muted = !v.muted; sync(); };
$("vol").oninput = e => { v.volume = e.target.value; v.muted = v.volume === 0; sync(); };
function sync() { $("mute").textContent = v.muted ? "🔇" : "🔊"; }
function setFull(on) { screen.classList.toggle("full", on); document.body.style.overflow = on ? "hidden" : ""; }
function exitFull() { if (document.fullscreenElement) document.exitFullscreen(); setFull(false); }
$("fs").onclick = () => {
  if (screen.classList.contains("full")) return exitFull();
  if (!$("gate").dataset.done) { v.muted = false; $("gate").dataset.done = 1; $("gate").classList.add("hide"); if (canPlay()) v.play().catch(() => {}); sync(); }
  setFull(true); // свой полный экран: видны только водяной знак и картинка
  if (screen.requestFullscreen) screen.requestFullscreen().catch(() => {});
};
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) setFull(false); });
// выйти: Esc или двойной тап/клик по экрану (кнопок на экране нет)
let lastTap = 0;
screen.addEventListener("pointerup", () => {
  const n = Date.now();
  if (screen.classList.contains("full") && n - lastTap < 350) exitFull();
  lastTap = n;
});
document.addEventListener("keydown", e => { if (e.key === "Escape") exitFull(); });

// онлайн
const nick = $("nick");
nick.value = localStorage.getItem("roptv_nick") || "";
const myId = localStorage.getItem("roptv_id") || (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()));
localStorage.setItem("roptv_id", myId);
const ch = sb.channel("roptv-online", { config: { presence: { key: myId } } });
const myName = () => nick.value.trim() || "Гость " + myId.slice(0, 4);
ch.on("presence", { event: "sync" }, () => {
  const st = ch.presenceState(), ul = $("users");
  ul.innerHTML = "";
  Object.values(st).forEach(m => { const li = document.createElement("li"); li.textContent = m[0].name; ul.appendChild(li); });
  $("count").textContent = Object.keys(st).length;
}).subscribe(s => { if (s === "SUBSCRIBED") ch.track({ name: myName() }); });
nick.onchange = () => { localStorage.setItem("roptv_nick", nick.value.trim()); ch.track({ name: myName() }); };

// эфир
(async () => {
  try {
    const { data: now } = await sb.rpc("server_now");
    if (now) offset = new Date(now).getTime() - Date.now();
    const { data } = await sb.from("broadcast").select("*").eq("id", 1).single();
    if (data) apply(data);
  } catch (e) { console.error(e); }
  sb.channel("roptv-broadcast")
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "broadcast" }, p => apply(p.new))
    .subscribe();
})();
</script>
</body>
</html>
